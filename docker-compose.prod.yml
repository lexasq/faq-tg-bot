services:
  bot:
    image: faq-bot:latest
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backups:/opt/faq-bot/backups
    healthcheck:
      # touch_liveness_file() (app/handlers/ops.py) writes this every 30s;
      # a container that stops updating it gets marked unhealthy.
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/faq-bot-liveness')<90 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
